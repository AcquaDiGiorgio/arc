[common]

[mapping]

[lrms]
lrms = fork

[arex]
loglevel = 5

[arex/ws]

[arex/ws/jobs]

[arex/data-staging]
loglevel = 5

[datadelivery-service]
loglevel = 5

[infosys]
loglevel = 5

[infosys/glue2]

[infosys/cluster]

[queue:fork]

# NEW SECTION
[grouping:test]
group_by = queue
# Conditions: eq, neq, lt, eq, mt, in
condition = eq 
check_value = fork
max_jobs = 3
max_seconds = 60
#group_exec = !!TODO!!
dry_run = yes
sender_pem = /root/.globus/cert.pem
sender_dn = 